<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>HOME GAMING - PS Rental Timer</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-space: #0b0d19;
      --card-bg: rgba(20, 25, 45, 0.75);
      --border-glow: #00f0ff;
      --accent-pink: #ff007f;
      --accent-green: #00ff88;
      --accent-yellow: #ffb700;
      --accent-purple: #9d4edd;
      --text-main: #ffffff;
      --text-sub: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-space);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 40%),
        radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Header */
    header {
      text-align: center;
      padding: 0.5rem 0 1.5rem 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 12px var(--border-glow), 0 0 24px var(--border-glow);
    }

    .brand i {
      color: var(--border-glow);
      font-size: 2.8rem;
      filter: drop-shadow(0 0 8px var(--border-glow));
    }

    /* Main Container (4 Timers) */
    .timer-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      flex-grow: 1;
      align-items: stretch;
      margin-bottom: 1rem;
    }

    /* Timer Card */
    .timer-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 16px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s ease;
      position: relative;
    }

    .timer-card.active {
      border-color: var(--border-glow);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center;
      color: var(--border-glow);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Time Display */
    .time-display {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 800;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 2px;
      margin: 1rem 0;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* Controls & Preset Buttons */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .btn {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 240, 255, 0.3));
      border: 1px solid var(--border-glow);
      color: #fff;
      padding: 0.6rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover {
      background: var(--border-glow);
      color: #000;
      box-shadow: 0 0 12px var(--border-glow);
    }

    .btn-start {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
    }

    .btn-stop {
      background: linear-gradient(135deg, #ff0844, #ffb199);
      border: none;
    }

    .btn-stop:hover {
      box-shadow: 0 0 12px var(--accent-pink);
    }

    .btn-restart {
      background: linear-gradient(135deg, #9d4edd, #c77dff);
      border: none;
    }

    .btn-restart:hover {
      box-shadow: 0 0 12px var(--accent-purple);
      color: #fff;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.4rem;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .btn-preset {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.8rem;
      padding: 0.45rem;
    }

    .btn-preset.fulltime {
      grid-column: span 2;
      background: rgba(255, 183, 0, 0.15);
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
    }

    .btn-preset.fulltime:hover {
      background: var(--accent-yellow);
      color: #000;
    }

    /* Price Box */
    .price-box {
      margin-top: 0.8rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed var(--accent-green);
      border-radius: 10px;
      padding: 0.7rem;
      text-align: center;
    }

    .price-label {
      font-size: 0.7rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .price-amount {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent-green);
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
      margin-top: 2px;
    }

    .hidden {
      display: none !important;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .timer-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-gamepad"></i>
      <span>Home Gaming</span>
    </div>
  </header>

  <!-- Container Timer Utama -->
  <div class="timer-container" id="timerContainer"></div>

  <script>
    const HOURLY_RATE = 5000; // Rp 5.000 per jam

    // Generasi 4 Slot PS secara dinamis
    const timerContainer = document.getElementById('timerContainer');
    
    for (let i = 1; i <= 4; i++) {
      const card = document.createElement('div');
      card.className = 'timer-card';
      card.id = `card-${i}`;
      card.innerHTML = `
        <div>
          <div class="card-title">
            <i class="fa-solid fa-tv"></i> Station ${i}
          </div>
          <div class="time-display" id="time-${i}">00:00:00</div>
        </div>

        <div class="controls">
          <!-- Tombol Mulai Awal -->
          <button class="btn btn-start" id="btn-start-init-${i}" onclick="showPresets(${i})">
            <i class="fa-solid fa-play"></i> Mulai
          </button>

          <!-- Menu Pilihan Waktu (Awalnya tersembunyi) -->
          <div class="preset-grid hidden" id="preset-group-${i}">
            <button class="btn btn-preset" onclick="startTimer(${i}, 0.5)">1/2 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 1)">1 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 1.5)">1 1/2 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 2)">2 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 2.5)">2 1/2 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 3)">3 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 3.5)">3 1/2 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 4)">4 Jam</button>
            <button class="btn btn-preset fulltime" onclick="startTimer(${i}, 'full')">Full Time</button>
          </div>

          <!-- Tombol Selesai (Awalnya tersembunyi) -->
          <button class="btn btn-stop hidden" id="btn-finish-${i}" onclick="stopTimer(${i}, false)">
            <i class="fa-solid fa-square"></i> Selesai
          </button>

          <!-- Tombol Restart (Awalnya tersembunyi) -->
          <button class="btn btn-restart hidden" id="btn-restart-${i}" onclick="resetTimer(${i})">
            <i class="fa-solid fa-rotate-right"></i> Restart
          </button>
        </div>

        <!-- Box Kalkulasi Harga (Awalnya tersembunyi) -->
        <div class="price-box hidden" id="price-box-${i}">
          <div class="price-label">Total Biaya</div>
          <div class="price-amount" id="price-${i}">Rp 0</div>
        </div>
      `;
      timerContainer.appendChild(card);
    }

    // State Manajemen Timer
    const timers = {};

    function showPresets(id) {
      document.getElementById(`btn-start-init-${id}`).classList.add('hidden');
      document.getElementById(`preset-group-${id}`).classList.remove('hidden');
    }

    function startTimer(id, mode) {
      document.getElementById(`preset-group-${id}`).classList.add('hidden');
      document.getElementById(`btn-finish-${id}`).classList.remove('hidden');
      document.getElementById(`btn-restart-${id}`).classList.add('hidden');
      document.getElementById(`price-box-${id}`).classList.remove('hidden');
      document.getElementById(`card-${id}`).classList.add('active');

      const startTime = Date.now();
      let durationSeconds = 0;
      let isFullTime = false;

      if (mode === 'full') {
        isFullTime = true;
      } else {
        durationSeconds = mode * 3600;
        const fixedPrice = mode * HOURLY_RATE;
        document.getElementById(`price-${id}`).innerText = formatRupiah(fixedPrice);
      }

      timers[id] = {
        interval: setInterval(() => updateTimer(id), 1000),
        startTime: startTime,
        durationSeconds: durationSeconds,
        isFullTime: isFullTime,
        mode: mode
      };

      updateTimer(id);
    }

    function updateTimer(id) {
      const timer = timers[id];
      const elapsedSeconds = Math.floor((Date.now() - timer.startTime) / 1000);

      if (timer.isFullTime) {
        document.getElementById(`time-${id}`).innerText = formatTime(elapsedSeconds);
        
        // Perhitungan Khusus Full Time: 
        // - Genap per jam = kelipatan Rp 5.000 (misal: 60 mnt = 5000, 120 mnt = 10000)
        // - Kelebihan dihitung setiap 10 menit (600 detik) bertambah Rp 1.000
        const totalMinutes = elapsedSeconds / 60;
        let currentPrice = 0;

        if (totalMinutes <= 0) {
          currentPrice = 0;
        } else {
          const fullHours = Math.floor(totalMinutes / 60);
          const remainderMinutes = totalMinutes % 60;

          currentPrice = fullHours * HOURLY_RATE;

          if (remainderMinutes > 0) {
            // Setiap kelebihan 10 menit (pembulatan ke atas per 10 menit) tambah 1000
            const extraBlocks = Math.ceil(remainderMinutes / 10);
            currentPrice += extraBlocks * 1000;
          }
        }

        document.getElementById(`price-${id}`).innerText = formatRupiah(currentPrice);
      } else {
        const remainingSeconds = timer.durationSeconds - elapsedSeconds;

        if (remainingSeconds <= 0) {
          document.getElementById(`time-${id}`).innerText = "00:00:00";
          document.getElementById(`time-${id}`).style.color = "#ff0844";
          stopTimer(id, true);
          return;
        }

        document.getElementById(`time-${id}`).innerText = formatTime(remainingSeconds);
      }
    }

    function stopTimer(id, isAutoStop = false) {
      if (timers[id]) {
        clearInterval(timers[id].interval);
      }

      document.getElementById(`btn-finish-${id}`).classList.add('hidden');
      document.getElementById(`btn-restart-${id}`).classList.remove('hidden');
      document.getElementById(`card-${id}`).classList.remove('active');

      if (isAutoStop) {
        document.getElementById(`time-${id}`).style.color = "#ffffff";
        alert(`Waktu untuk Station ${id} telah HABIS!`);
      }
    }

    function resetTimer(id) {
      document.getElementById(`btn-restart-${id}`).classList.add('hidden');
      document.getElementById(`btn-start-init-${id}`).classList.remove('hidden');
      document.getElementById(`price-box-${id}`).classList.add('hidden');
      document.getElementById(`preset-group-${id}`).classList.add('hidden');
      document.getElementById(`time-${id}`).innerText = "00:00:00";
      document.getElementById(`time-${id}`).style.color = "#ffffff";
      document.getElementById(`price-${id}`).innerText = "Rp 0";
    }

    // Utility Format Waktu (HH:MM:SS)
    function formatTime(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return [hours, minutes, seconds]
        .map(v => v < 10 ? "0" + v : v)
        .join(":");
    }

    // Utility Format Rupiah
    function formatRupiah(amount) {
      return 'Rp ' + amount.toLocaleString('id-ID');
    }
  </script>
</body>
</html>
