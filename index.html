<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>HOME GAMING - PS Rental Timer</title>
  <!-- Favicon / Thumbnail Browser -->
  <link rel="icon" type="image/png" href="https://files.catbox.moe/2ixv2d.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-space: #0b0d19;
      --card-bg: rgba(20, 25, 45, 0.75);
      --border-glow: #00f0ff;
      --accent-pink: #ff007f;
      --accent-green: #00ff88;
      --accent-yellow: #ffb700;
      --accent-purple: #9d4edd;
      --text-main: #ffffff;
      --text-sub: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-space);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 40%),
        radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 0.5rem 0 1.5rem 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 12px var(--border-glow), 0 0 24px var(--border-glow);
    }

    .brand img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px var(--border-glow));
    }

    .timer-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      flex-grow: 1;
      align-items: stretch;
      margin-bottom: 1.5rem;
    }

    .timer-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 16px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s ease;
      position: relative;
    }

    .timer-card.active {
      border-color: var(--border-glow);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center;
      color: var(--border-glow);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .time-display {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 800;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 2px;
      margin: 1rem 0;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .btn {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 240, 255, 0.3));
      border: 1px solid var(--border-glow);
      color: #fff;
      padding: 0.6rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover {
      background: var(--border-glow);
      color: #000;
      box-shadow: 0 0 12px var(--border-glow);
    }

    .btn-start {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
    }

    .btn-stop {
      background: linear-gradient(135deg, #ff0844, #ffb199);
      border: none;
      padding: 0.8rem;
      font-size: 1rem;
    }

    .btn-stop:hover {
      box-shadow: 0 0 12px var(--accent-pink);
    }

    .btn-restart {
      background: linear-gradient(135deg, #9d4edd, #c77dff);
      border: none;
      padding: 0.8rem;
      font-size: 1rem;
    }

    .btn-restart:hover {
      box-shadow: 0 0 12px var(--accent-purple);
      color: #fff;
    }

    .btn-jeda {
      background: linear-gradient(135deg, #ffb700, #ff8500);
      border: none;
      color: #000;
      font-weight: 700;
      padding: 0.6rem;
    }
    .btn-jeda:hover {
      box-shadow: 0 0 12px var(--accent-yellow);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.4rem;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .extension-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.3rem;
      margin-bottom: 0.3rem;
    }

    .btn-ext {
      background: rgba(255, 183, 0, 0.1);
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
      font-size: 0.75rem;
      padding: 0.4rem;
    }
    .btn-ext:hover {
      background: var(--accent-yellow);
      color: #000;
    }

    .btn-ps3 {
      border-color: #00f0ff;
      color: #00f0ff;
      background: rgba(0, 240, 255, 0.05);
    }
    .btn-ps3:hover {
      background: #00f0ff;
      color: #000;
      box-shadow: 0 0 10px #00f0ff;
    }

    .btn-ps4 {
      border-color: #ff007f;
      color: #ff007f;
      background: rgba(255, 0, 127, 0.05);
    }
    .btn-ps4:hover {
      background: #ff007f;
      color: #fff;
      box-shadow: 0 0 10px #ff007f;
    }

    .btn-ps5 {
      border-color: #ffb700;
      color: #ffb700;
      background: rgba(255, 183, 0, 0.05);
      grid-column: span 2;
    }
    .btn-ps5:hover {
      background: #ffb700;
      color: #000;
      box-shadow: 0 0 10px #ffb700;
    }

    .btn-preset {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.8rem;
      padding: 0.45rem;
    }

    .btn-preset.fulltime {
      grid-column: span 2;
      background: rgba(255, 183, 0, 0.15);
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
    }

    .btn-preset.fulltime:hover {
      background: var(--accent-yellow);
      color: #000;
    }

    .price-box {
      margin-top: 0.8rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed var(--accent-green);
      border-radius: 10px;
      padding: 0.7rem;
      text-align: center;
    }

    .price-label {
      font-size: 0.7rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .price-amount {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent-green);
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
      margin-top: 2px;
    }

    .remaining-box {
      margin-top: 0.5rem;
      background: rgba(255, 0, 127, 0.1);
      border: 1px dashed var(--accent-pink);
      border-radius: 8px;
      padding: 0.5rem;
      text-align: center;
    }
    .remaining-label {
      font-size: 0.65rem;
      color: var(--text-sub);
      text-transform: uppercase;
    }
    .remaining-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-pink);
    }

    /* Kasir Summary Panel */
    .summary-panel {
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 16px;
      padding: 1.2rem 1.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
    }

    .summary-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--border-glow);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-close-day {
      background: linear-gradient(135deg, #ff0844, #9d4edd);
      border: none;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .btn-close-day:hover {
      box-shadow: 0 0 12px var(--accent-pink);
    }

    .summary-section-title {
      font-size: 0.85rem;
      color: var(--border-glow);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.3rem;
      font-weight: 700;
    }

    .summary-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8rem;
    }

    .summary-item {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0.7rem;
      text-align: center;
    }

    .summary-label {
      font-size: 0.7rem;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .summary-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    .summary-footer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 0.3rem;
    }

    .summary-total-box-duration {
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      padding: 0.9rem 1.2rem;
      text-align: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    }

    .summary-total-label-duration {
      font-size: 0.9rem;
      color: var(--border-glow);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .summary-total-val-duration {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--border-glow);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    .summary-total-box-payment {
      background: rgba(0, 255, 136, 0.05);
      border: 1px solid var(--accent-green);
      border-radius: 12px;
      padding: 0.9rem 1.2rem;
      text-align: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.15);
    }

    .summary-total-label-payment {
      font-size: 0.9rem;
      color: var(--accent-green);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .summary-total-val-payment {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent-green);
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
    }

    /* --- STYLES POP-UP MODAL CUSTOM --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 7, 15, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #121629;
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 2rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 3rem;
      color: var(--accent-yellow);
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 10px var(--accent-yellow));
    }

    .modal-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.6rem;
    }

    .modal-desc {
      font-size: 0.95rem;
      color: var(--text-sub);
      line-height: 1.4;
      margin-bottom: 1.5rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
    }

    .btn-modal-cancel {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      flex: 1;
    }
    .btn-modal-cancel:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-modal-confirm {
      background: linear-gradient(135deg, #ff0844, #ff007f);
      border: none;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      flex: 1;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
    }
    .btn-modal-confirm:hover {
      box-shadow: 0 0 18px var(--accent-pink);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1024px) {
      .timer-container {
        grid-template-columns: repeat(2, 1fr);
      }
      .summary-grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }
      .summary-footer-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="https://files.catbox.moe/2ixv2d.png" alt="Logo Home Gaming">
      <span>Home Gaming</span>
    </div>
  </header>

  <div class="timer-container" id="timerContainer"></div>

  <div class="summary-panel">
    <div class="summary-header">
      <div class="summary-title"><i class="fa-solid fa-cash-register"></i> SUMMARY</div>
      <button class="btn-close-day" onclick="askCloseDay()"><i class="fa-solid fa-power-off"></i> Waktunya Tutup</button>
    </div>

    <div class="summary-section-title"><i class="fa-solid fa-clock"></i> Waktu</div>
    <div class="summary-grid-4" id="durationGrid"></div>

    <div class="summary-section-title"><i class="fa-solid fa-wallet"></i> IDR</div>
    <div class="summary-grid-4" id="revenueGrid"></div>

    <div class="summary-footer-grid">
      <div class="summary-total-box-duration">
        <div class="summary-total-label-duration"><i class="fa-solid fa-hourglass-half"></i> Total Waktu</div>
        <div class="summary-total-val-duration" id="totalDurationVal">0.0 Jam</div>
      </div>
      <div class="summary-total-box-payment">
        <div class="summary-total-label-payment"><i class="fa-solid fa-money-bill-wave"></i> Total Payment</div>
        <div class="summary-total-val-payment" id="totalPaymentVal">Rp 0</div>
      </div>
    </div>
  </div>

  <!-- POP-UP MODAL CUSTOM -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <div class="modal-icon" id="modalIcon"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <div class="modal-title" id="modalTitle">Konfirmasi</div>
      <div class="modal-desc" id="modalDesc">Apakah Anda yakin?</div>
      <div class="modal-actions" id="modalActions">
        <button class="btn-modal-cancel" id="btnModalCancel" onclick="closeModal()">Batal</button>
        <button class="btn-modal-confirm" id="btnModalConfirm">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

  <script>
    const rates = {
      'PS3': { hourly: 5000, extra10: 1000, perSecond: 5000 / 3600, name: 'PS 3' },
      'PS4': { hourly: 8000, extra10: 2000, perSecond: 8000 / 3600, name: 'PS 4' },
      'PS5': { hourly: 15000, extra10: 3000, perSecond: 15000 / 3600, name: 'PS 5' }
    };

    const timerContainer = document.getElementById('timerContainer');
    const timers = {};
    const selectedConsoles = {};
    
    let dailyStats = JSON.parse(localStorage.getItem('ps_daily_stats')) || {
      1: { totalSeconds: 0, revenue: 0 },
      2: { totalSeconds: 0, revenue: 0 },
      3: { totalSeconds: 0, revenue: 0 },
      4: { totalSeconds: 0, revenue: 0 }
    };

    for (let i = 1; i <= 4; i++) {
      const card = document.createElement('div');
      card.className = 'timer-card';
      card.id = `card-${i}`;
      card.innerHTML = `
        <div>
          <div class="card-title">
            <i class="fa-solid fa-tv"></i> Station ${i}
          </div>
          <div class="time-display" id="time-${i}">00:00:00</div>
        </div>

        <div class="controls">
          <button class="btn btn-start" id="btn-start-init-${i}" onclick="showConsoleSelection(${i})">
            <i class="fa-solid fa-play"></i> Mulai
          </button>

          <div class="preset-grid hidden" id="console-group-${i}">
            <button class="btn btn-preset btn-ps3" onclick="selectConsole(${i}, 'PS3')">PS 3</button>
            <button class="btn btn-preset btn-ps4" onclick="selectConsole(${i}, 'PS4')">PS 4</button>
            <button class="btn btn-preset btn-ps5" onclick="selectConsole(${i}, 'PS5')">PS 5</button>
          </div>

          <div class="preset-grid hidden" id="preset-group-${i}">
            <button class="btn btn-preset" onclick="startTimer(${i}, 0.5)">30 Menit</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 1)">1 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 1.5)">1 1/2 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 2)">2 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 2.5)">2 1/2 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 3)">3 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 3.5)">3 1/2 Jam</button>
            <button class="btn btn-preset" onclick="startTimer(${i}, 4)">4 Jam</button>
            <button class="btn btn-preset fulltime" onclick="startTimer(${i}, 'full')">Full Time</button>
          </div>

          <!-- Tombol Tambahan Waktu (Hanya muncul SETELAH Selesai diklik) -->
          <div class="extension-grid hidden" id="extension-group-${i}">
            <button class="btn btn-ext" onclick="addTime(${i}, 900)">+15 Mnt</button>
            <button class="btn btn-ext" onclick="addTime(${i}, 1800)">+30 Mnt</button>
            <button class="btn btn-ext" onclick="addTime(${i}, 3600)">+1 Jam</button>
            <button class="btn btn-ext" onclick="addTime(${i}, 7200)">+2 Jam</button>
          </div>

          <!-- Tombol Jeda / Lanjut (Hanya muncul SAAT BERJALAN) -->
          <button class="btn btn-jeda hidden" id="btn-jeda-${i}" onclick="togglePause(${i})">
            <i class="fa-solid fa-pause"></i> Jeda
          </button>

          <!-- Tombol Selesai (Hanya muncul SAAT BERJALAN) -->
          <button class="btn btn-stop hidden" id="btn-finish-${i}" onclick="stopTimer(${i}, false)">
            <i class="fa-solid fa-square"></i> Selesai
          </button>

          <button class="btn btn-restart hidden" id="btn-restart-${i}" onclick="resetTimer(${i})">
            <i class="fa-solid fa-rotate-right"></i> Restart
          </button>
        </div>

        <div class="price-box hidden" id="price-box-${i}">
          <div class="price-label" id="console-label-${i}">Konsol: -</div>
          <div class="price-amount" id="price-${i}">Rp 0</div>
        </div>

        <div class="remaining-box hidden" id="remaining-box-${i}">
          <div class="remaining-label">Sisa Waktu</div>
          <div class="remaining-value" id="remaining-val-${i}">00:00:00</div>
        </div>
      `;
      timerContainer.appendChild(card);
    }

    function showConsoleSelection(id) {
      document.getElementById(`btn-start-init-${id}`).classList.add('hidden');
      document.getElementById(`console-group-${id}`).classList.remove('hidden');
    }

    function selectConsole(id, consoleType) {
      selectedConsoles[id] = consoleType;
      document.getElementById(`console-group-${id}`).classList.add('hidden');
      document.getElementById(`preset-group-${id}`).classList.remove('hidden');
      document.getElementById(`console-label-${id}`).innerText = `Konsol: ${rates[consoleType].name}`;
    }

    function calculateFinalPrice(elapsedSeconds, consoleType) {
      const rate = rates[consoleType];
      const totalMinutes = elapsedSeconds / 60;
      if (totalMinutes <= 0) return 0;

      const fullHours = Math.floor(totalMinutes / 60);
      const remainderMinutes = totalMinutes % 60;

      let currentPrice = fullHours * rate.hourly;

      if (remainderMinutes >= 50) {
        currentPrice = (fullHours + 1) * rate.hourly;
      } else if (remainderMinutes > 4) {
        const excessMinutes = remainderMinutes - 4;
        const extraBlocks = Math.ceil(excessMinutes / 10);
        currentPrice += extraBlocks * rate.extra10;
      }

      return currentPrice;
    }

    function startTimer(id, mode) {
      document.getElementById(`preset-group-${id}`).classList.add('hidden');
      document.getElementById(`extension-group-${id}`).classList.add('hidden'); // Sembunyikan tambahan waktu saat berjalan
      document.getElementById(`btn-jeda-${id}`).classList.remove('hidden');
      document.getElementById(`btn-finish-${id}`).classList.remove('hidden');
      document.getElementById(`price-box-${id}`).classList.remove('hidden');
      document.getElementById(`card-${id}`).classList.add('active');

      const consoleType = selectedConsoles[id] || 'PS3';
      const startTime = Date.now();
      let durationSeconds = mode === 'full' ? 0 : mode * 3600;
      let isFullTime = (mode === 'full');

      timers[id] = {
        startTime: startTime,
        durationSeconds: durationSeconds,
        isFullTime: isFullTime,
        mode: mode === 'full' ? 0 : mode,
        consoleType: consoleType,
        isPaused: false,
        isFinished: false,
        pausedElapsed: 0,
        lastLoggedElapsed: 0,
        lastLoggedPrice: 0,
        interval: setInterval(() => updateTimer(id), 1000)
      };

      saveTimersToStorage();
      updateTimer(id);
    }

    function togglePause(id) {
      const timer = timers[id];
      if (!timer || timer.isFinished) return;

      const btnJeda = document.getElementById(`btn-jeda-${id}`);
      const card = document.getElementById(`card-${id}`);

      if (!timer.isPaused) {
        clearInterval(timer.interval);
        timer.interval = null;
        timer.isPaused = true;
        timer.pausedElapsed = Math.floor((Date.now() - timer.startTime) / 1000);

        btnJeda.innerHTML = '<i class="fa-solid fa-play"></i> Lanjut';
        btnJeda.style.background = 'linear-gradient(135deg, #00ff88, #00b4d8)';
        btnJeda.style.color = '#000';
        card.classList.remove('active');
        card.style.borderColor = 'var(--accent-yellow)';
      } else {
        timer.startTime = Date.now() - (timer.pausedElapsed * 1000);
        timer.isPaused = false;
        timer.interval = setInterval(() => updateTimer(id), 1000);

        btnJeda.innerHTML = '<i class="fa-solid fa-pause"></i> Jeda';
        btnJeda.style.background = '';
        btnJeda.style.color = '';
        card.classList.add('active');
        card.style.borderColor = '';
      }
      saveTimersToStorage();
    }

    // FUNGSI TAMBAH WAKTU SETELAH SELESAI (Mengikuti aturan pakem jam konsol)
    function addTime(id, secondsToAdd) {
      const timer = timers[id];
      if (!timer) return;

      const hoursToAdd = secondsToAdd / 3600;

      if (timer.isFinished) {
        // Kurangi statistik harian sebelumnya yang terlanjur tercatat saat klik selesai
        if (timer.lastLoggedElapsed > 0) {
          dailyStats[id].totalSeconds = Math.max(0, dailyStats[id].totalSeconds - timer.lastLoggedElapsed);
          dailyStats[id].revenue = Math.max(0, dailyStats[id].revenue - timer.lastLoggedPrice);
          saveDailyStats();
          renderSummary();
        }

        timer.isFinished = false;
        
        document.getElementById(`remaining-box-${id}`).classList.add('hidden');
        document.getElementById(`btn-restart-${id}`).classList.add('hidden');
        document.getElementById(`extension-group-${id}`).classList.add('hidden'); // Sembunyikan lagi tombol tambah waktu setelah dilanjut
        document.getElementById(`btn-finish-${id}`).classList.remove('hidden');
        document.getElementById(`btn-jeda-${id}`).classList.remove('hidden');
        document.getElementById(`price-box-${id}`).classList.remove('hidden');
        document.getElementById(`card-${id}`).classList.add('active');
        document.getElementById(`time-${id}`).style.color = "#ffffff";

        const prevElapsed = timer.pausedElapsed > 0 ? timer.pausedElapsed : Math.floor((Date.now() - timer.startTime) / 1000);
        timer.startTime = Date.now() - (prevElapsed * 1000);

        if (timer.isFullTime) {
          timer.isFullTime = false;
          timer.mode = (prevElapsed / 3600) + hoursToAdd;
          timer.durationSeconds = prevElapsed + secondsToAdd;
        } else {
          timer.mode += hoursToAdd;
          timer.durationSeconds = Math.max(timer.durationSeconds, prevElapsed) + secondsToAdd;
        }

        timer.isPaused = false;
        const btnJeda = document.getElementById(`btn-jeda-${id}`);
        btnJeda.innerHTML = '<i class="fa-solid fa-pause"></i> Jeda';
        btnJeda.style.background = '';
        btnJeda.style.color = '';

        timer.interval = setInterval(() => updateTimer(id), 1000);
      }

      saveTimersToStorage();
      updateTimer(id);
    }

    function updateTimer(id) {
      const timer = timers[id];
      if (!timer || timer.isPaused || timer.isFinished) return;
      
      const elapsedSeconds = Math.floor((Date.now() - timer.startTime) / 1000);
      const rate = rates[timer.consoleType];
      
      const liveRunningPrice = Math.round(elapsedSeconds * rate.perSecond);
      document.getElementById(`price-${id}`).innerText = formatRupiah(liveRunningPrice);

      if (timer.isFullTime) {
        document.getElementById(`time-${id}`).innerText = formatTime(elapsedSeconds);
      } else {
        const remainingSeconds = timer.durationSeconds - elapsedSeconds;

        if (remainingSeconds <= 0) {
          document.getElementById(`time-${id}`).innerText = "00:00:00";
          document.getElementById(`time-${id}`).style.color = "#ff0844";
          stopTimer(id, true);
          return;
        }

        document.getElementById(`time-${id}`).innerText = formatTime(remainingSeconds);
      }
    }

    function stopTimer(id, isAutoStop = false) {
      const timer = timers[id];
      if (!timer) return;

      if (timer.interval) {
        clearInterval(timer.interval);
        timer.interval = null;
      }

      timer.isFinished = true;
      const elapsedSeconds = timer.isPaused ? timer.pausedElapsed : Math.floor((Date.now() - timer.startTime) / 1000);
      timer.pausedElapsed = elapsedSeconds;

      let finalPrice = 0;
      let remainingStr = "00:00:00";

      if (timer.isFullTime) {
        finalPrice = calculateFinalPrice(elapsedSeconds, timer.consoleType);
        remainingStr = "00:00:00 (Full Time)";
      } else {
        finalPrice = timer.mode * rates[timer.consoleType].hourly;
        const remSecs = timer.durationSeconds - elapsedSeconds;
        if (remSecs > 0) {
          remainingStr = formatTime(remSecs);
        } else {
          remainingStr = "00:00:00 (Habis)";
        }
      }
      
      document.getElementById(`price-${id}`).innerText = formatRupiah(finalPrice);
      document.getElementById(`remaining-val-${id}`).innerText = remainingStr;
      document.getElementById(`remaining-box-${id}`).classList.remove('hidden');

      timer.lastLoggedElapsed = elapsedSeconds;
      timer.lastLoggedPrice = finalPrice;

      dailyStats[id].totalSeconds += elapsedSeconds;
      dailyStats[id].revenue += finalPrice;
      saveDailyStats();
      renderSummary();

      document.getElementById(`btn-jeda-${id}`).classList.add('hidden');
      document.getElementById(`btn-finish-${id}`).classList.add('hidden');
      
      // Munculkan tombol tambahan waktu SETELAH diklik selesai
      document.getElementById(`extension-group-${id}`).classList.remove('hidden');
      document.getElementById(`btn-restart-${id}`).classList.remove('hidden');
      
      document.getElementById(`card-${id}`).classList.remove('active');
      document.getElementById(`card-${id}`).style.borderColor = '';

      saveTimersToStorage();

      if (isAutoStop) {
        document.getElementById(`time-${id}`).style.color = "#ffffff";
        showCustomAlert("Waktu Habis!", `Waktu untuk Station ${id} telah HABIS!`);
      }
    }

    function resetTimer(id) {
      if (timers[id]) {
        if (timers[id].interval) clearInterval(timers[id].interval);
        delete timers[id];
      }
      delete selectedConsoles[id];
      saveTimersToStorage();

      const btnJeda = document.getElementById(`btn-jeda-${id}`);
      btnJeda.innerHTML = '<i class="fa-solid fa-pause"></i> Jeda';
      btnJeda.style.background = '';
      btnJeda.style.color = '';

      document.getElementById(`btn-restart-${id}`).classList.add('hidden');
      document.getElementById(`extension-group-${id}`).classList.add('hidden');
      document.getElementById(`btn-start-init-${id}`).classList.remove('hidden');
      document.getElementById(`price-box-${id}`).classList.add('hidden');
      document.getElementById(`console-group-${id}`).classList.add('hidden');
      document.getElementById(`preset-group-${id}`).classList.add('hidden');
      document.getElementById(`remaining-box-${id}`).classList.add('hidden');
      document.getElementById(`card-${id}`).style.borderColor = '';
      document.getElementById(`time-${id}`).innerText = "00:00:00";
      document.getElementById(`time-${id}`).style.color = "#ffffff";
      document.getElementById(`price-${id}`).innerText = "Rp 0";
      document.getElementById(`console-label-${id}`).innerText = "Konsol: -";
    }

    function renderSummary() {
      const durationGrid = document.getElementById('durationGrid');
      const revenueGrid = document.getElementById('revenueGrid');
      const totalPaymentVal = document.getElementById('totalPaymentVal');
      const totalDurationVal = document.getElementById('totalDurationVal');

      durationGrid.innerHTML = '';
      revenueGrid.innerHTML = '';

      let totalOverallRevenue = 0;
      let totalOverallSeconds = 0;

      for (let i = 1; i <= 4; i++) {
        const totalSecs = dailyStats[i].totalSeconds;
        totalOverallSeconds += totalSecs;
        const hoursPlayed = (totalSecs / 3600).toFixed(1);
        
        const item = document.createElement('div');
        item.className = 'summary-item';
        item.innerHTML = `
          <div class="summary-label">Station ${i}</div>
          <div class="summary-val">${hoursPlayed} Jam</div>
        `;
        durationGrid.appendChild(item);
      }

      for (let i = 1; i <= 4; i++) {
        const rev = dailyStats[i].revenue;
        totalOverallRevenue += rev;
        const item = document.createElement('div');
        item.className = 'summary-item';
        item.innerHTML = `
          <div class="summary-label">Station ${i}</div>
          <div class="summary-val" style="color: var(--accent-green);">${formatRupiah(rev)}</div>
        `;
        revenueGrid.appendChild(item);
      }

      const totalHoursOverall = (totalOverallSeconds / 3600).toFixed(1);

      totalDurationVal.innerText = `${totalHoursOverall} Jam`;
      totalPaymentVal.innerText = formatRupiah(totalOverallRevenue);
    }

    function saveDailyStats() {
      localStorage.setItem('ps_daily_stats', JSON.stringify(dailyStats));
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    function askCloseDay() {
      const modal = document.getElementById('customModal');
      document.getElementById('modalIcon').innerHTML = '<i class="fa-solid fa-power-off" style="color: var(--accent-pink);"></i>';
      document.getElementById('modalTitle').innerText = 'Waktunya Tutup';
      document.getElementById('modalDesc').innerText = 'Apakah Anda yakin ingin mereset seluruh data harian kasir untuk menutup rental?';
      
      const confirmBtn = document.getElementById('btnModalConfirm');
      const cancelBtn = document.getElementById('btnModalCancel');
      
      cancelBtn.style.display = 'block';
      confirmBtn.innerText = 'Ya, Reset Data';
      confirmBtn.onclick = function() {
        localStorage.removeItem('ps_daily_stats');
        localStorage.removeItem('ps_rental_timers');
        localStorage.removeItem('ps_rental_consoles');
        location.reload();
      };

      modal.classList.add('active');
    }

    function showCustomAlert(title, message) {
      const modal = document.getElementById('customModal');
      document.getElementById('modalIcon').innerHTML = '<i class="fa-solid fa-bell" style="color: var(--accent-yellow);"></i>';
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalDesc').innerText = message;
      
      const confirmBtn = document.getElementById('btnModalConfirm');
      const cancelBtn = document.getElementById('btnModalCancel');
      
      cancelBtn.style.display = 'none';
      confirmBtn.innerText = 'Mengerti';
      confirmBtn.onclick = closeModal;

      modal.classList.add('active');
    }

    function saveTimersToStorage() {
      const dataToSave = {};
      for (let id in timers) {
        dataToSave[id] = {
          startTime: timers[id].startTime,
          durationSeconds: timers[id].durationSeconds,
          isFullTime: timers[id].isFullTime,
          mode: timers[id].mode,
          consoleType: timers[id].consoleType,
          isPaused: timers[id].isPaused,
          isFinished: timers[id].isFinished,
          pausedElapsed: timers[id].pausedElapsed,
          lastLoggedElapsed: timers[id].lastLoggedElapsed,
          lastLoggedPrice: timers[id].lastLoggedPrice,
          isRunning: timers[id].interval ? true : false
        };
      }
      localStorage.setItem('ps_rental_timers', JSON.stringify(dataToSave));
      localStorage.setItem('ps_rental_consoles', JSON.stringify(selectedConsoles));
    }

    function loadTimersFromStorage() {
      const savedTimers = localStorage.getItem('ps_rental_timers');
      const savedConsoles = localStorage.getItem('ps_rental_consoles');
      
      if (savedConsoles) {
        Object.assign(selectedConsoles, JSON.parse(savedConsoles));
      }

      if (savedTimers) {
        const parsed = JSON.parse(savedTimers);
        for (let id in parsed) {
          const data = parsed[id];
          if (data && data.startTime) {
            selectedConsoles[id] = data.consoleType;
            document.getElementById(`console-label-${id}`).innerText = `Konsol: ${rates[data.consoleType].name}`;
            
            if (data.isFinished) {
              document.getElementById(`btn-start-init-${id}`).classList.add('hidden');
              document.getElementById(`btn-finish-${id}`).classList.add('hidden');
              document.getElementById(`btn-jeda-${id}`).classList.add('hidden');
              document.getElementById(`extension-group-${id}`).classList.remove('hidden');
              document.getElementById(`btn-restart-${id}`).classList.remove('hidden');
              document.getElementById(`price-box-${id}`).classList.remove('hidden');
              
              timers[id] = {
                startTime: data.startTime,
                durationSeconds: data.durationSeconds,
                isFullTime: data.isFullTime,
                mode: data.mode,
                consoleType: data.consoleType,
                isPaused: false,
                isFinished: true,
                pausedElapsed: data.pausedElapsed || 0,
                lastLoggedElapsed: data.lastLoggedElapsed || 0,
                lastLoggedPrice: data.lastLoggedPrice || 0,
                interval: null
              };

              const elapsedSeconds = data.pausedElapsed || 0;
              document.getElementById(`price-${id}`).innerText = formatRupiah(calculateFinalPrice(elapsedSeconds, data.consoleType));
              
              if (data.isFullTime) {
                document.getElementById(`time-${id}`).innerText = formatTime(elapsedSeconds);
              } else {
                const remSecs = data.durationSeconds - elapsedSeconds;
                document.getElementById(`time-${id}`).innerText = formatTime(remSecs > 0 ? remSecs : 0);
              }
            } else if (data.isRunning || data.isPaused) {
              document.getElementById(`btn-start-init-${id}`).classList.add('hidden');
              document.getElementById(`extension-group-${id}`).classList.add('hidden');
              document.getElementById(`btn-jeda-${id}`).classList.remove('hidden');
              document.getElementById(`btn-finish-${id}`).classList.remove('hidden');
              document.getElementById(`price-box-${id}`).classList.remove('hidden');

              timers[id] = {
                startTime: data.startTime,
                durationSeconds: data.durationSeconds,
                isFullTime: data.isFullTime,
                mode: data.mode,
                consoleType: data.consoleType,
                isPaused: data.isPaused || false,
                isFinished: false,
                pausedElapsed: data.pausedElapsed || 0,
                lastLoggedElapsed: data.lastLoggedElapsed || 0,
                lastLoggedPrice: data.lastLoggedPrice || 0,
                interval: null
              };

              if (data.isPaused) {
                const btnJeda = document.getElementById(`btn-jeda-${id}`);
                btnJeda.innerHTML = '<i class="fa-solid fa-play"></i> Lanjut';
                btnJeda.style.background = 'linear-gradient(135deg, #00ff88, #00b4d8)';
                btnJeda.style.color = '#000';
                document.getElementById(`card-${id}`).style.borderColor = 'var(--accent-yellow)';
                
                const elapsedSeconds = data.pausedElapsed;
                const rate = rates[data.consoleType];
                document.getElementById(`price-${id}`).innerText = formatRupiah(Math.round(elapsedSeconds * rate.perSecond));
                if (data.isFullTime) {
                  document.getElementById(`time-${id}`).innerText = formatTime(elapsedSeconds);
                } else {
                  const remSecs = data.durationSeconds - elapsedSeconds;
                  document.getElementById(`time-${id}`).innerText = formatTime(remSecs > 0 ? remSecs : 0);
                }
              } else {
                timers[id].interval = setInterval(() => updateTimer(id), 1000);
                document.getElementById(`card-${id}`).classList.add('active');
                updateTimer(id);
              }
            }
          }
        }
      }
      renderSummary();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadTimersFromStorage();
    });

    function formatTime(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return [hours, minutes, seconds]
        .map(v => v < 10 ? "0" + v : v)
        .join(":");
    }

    function formatRupiah(amount) {
      return 'Rp ' + amount.toLocaleString('id-ID');
    }
  </script>
</body>
